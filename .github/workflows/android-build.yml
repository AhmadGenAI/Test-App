name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Diagnostic Info
        run: |
          node -v
          npm -v
          ls -la
          cat package.json
          ls -R src/

      - name: Install Dependencies
        run: npm install --verbose > npm_logs.txt 2>&1
        continue-on-error: true

      - name: Upload NPM Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs
          path: npm_logs.txt

      - name: Push Logs to Debug Branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b debug-logs || git checkout debug-logs
          git add npm_logs.txt
          git commit -m "Debug: npm install logs" || echo "No changes to commit"
          git push origin debug-logs --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Web App
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor Sync
        run: npx cap sync

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
